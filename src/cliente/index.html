<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSampler Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>WebSampler Studio</h1>
    <p>Pressione as teclas no teclado ou clique nos pads:</p>
    
    <div class="pad-grid">
      <button class="pad" data-key="a" data-note="C4">A (Dó)</button>
      <button class="pad" data-key="s" data-note="D4">S (Ré)</button>
      <button class="pad" data-key="d" data-note="E4">D (Mi)</button>
      <button class="pad" data-key="f" data-note="F4">F (Fá)</button>
    </div>
  </main>

  <script src="js/audio.js"></script>
</body>
</html>
